name: Bug Report
description: Report a problem with nLink
body:
  - type: input
    attributes:
      label: Version
      description: Example: v0.7.0
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Install Type
      options:
        - Installer
        - Portable
        - From source
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Role
      options:
        - Helper
        - Helpee
        - Both
        - Not sure
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Area
      options:
        - Connection/session
        - Chat
        - File transfer
        - Screen share
        - Remote control
        - Install/update
        - Diagnostics/support
        - Other
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Transport
      options:
        - NKN
        - DEVLOCAL
        - Not sure

  - type: textarea
    attributes:
      label: Steps to reproduce
      description: List exactly what you clicked or ran.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected behavior

  - type: textarea
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    attributes:
      label: Diagnostics output
      description: Paste from Diagnostics -> Copy diagnostics. See docs/supportability.md for what to collect.

  - type: textarea
    attributes:
      label: Hang Report
      description: If the app froze, paste the Save Hang Report path or attach the report when requested.

  - type: textarea
    attributes:
      label: Screenshare evidence
      description: For screenshare issues, paste the Diagnostics screenshare evidence block or screenshare-operator-verdict.txt when available.
