name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_gui_smoke:
        description: Run optional Windows GUI smoke tests
        required: false
        default: false
        type: boolean

jobs:
  smoke:
    runs-on: windows-latest
    env:
      NLINK_BRIDGE_RUNTIME_DIR: artifacts/bridge/win-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build nLink.sln -c Release --no-restore

      - name: Format check (non-blocking)
        id: format_verify
        continue-on-error: true
        run: dotnet format nLink.sln --verify-no-changes --no-restore

      - name: Format check guidance
        if: ${{ always() && steps.format_verify.outcome == 'failure' }}
        run: |
          echo "dotnet format --verify-no-changes found formatting drift."
          echo "Run: dotnet format nLink.sln"
          echo "This is non-blocking for now."

      - name: Build bridge bundle
        shell: powershell
        run: .\installer\Build-BridgeBundle.ps1 -Runtime win-x64

      - name: Verify bridge bundle layout
        shell: powershell
        run: |
          Write-Host "NLINK_BRIDGE_RUNTIME_DIR=$env:NLINK_BRIDGE_RUNTIME_DIR"
          if (-not (Test-Path $env:NLINK_BRIDGE_RUNTIME_DIR)) {
            throw "Bridge runtime directory not found: $env:NLINK_BRIDGE_RUNTIME_DIR"
          }
          Get-ChildItem -Path $env:NLINK_BRIDGE_RUNTIME_DIR -Force
          Get-ChildItem -Path (Join-Path $env:NLINK_BRIDGE_RUNTIME_DIR "node_modules") -Force | Select-Object -First 20

      - name: Smoke tests
        run: dotnet test -c Release --filter Category=Smoke --no-build --logger "trx;LogFileName=smoke-results.trx"

      - name: Reliability gate (DevLocal benchmark, fast)
        run: dotnet run -c Release --no-build --project src/nLink.App -- --bench --cycles 20 --delay-ms 0 --transport devlocal --bridge-reuse-mode persession --reliability-gate

      - name: Upload smoke test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-results
          path: '**/smoke-results.trx'
          if-no-files-found: ignore

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-artifacts
          path: artifacts/bench/**
          if-no-files-found: ignore

      - name: GUI smoke tests (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_gui_smoke == true }}
        env:
          NLINK_RUN_GUI_SMOKE: '1'
        run: dotnet test -c Release --filter Category=GuiSmoke --no-build --logger "trx;LogFileName=gui-smoke-results.trx"

      - name: Upload GUI smoke test results
        uses: actions/upload-artifact@v4
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.run_gui_smoke == true }}
        with:
          name: gui-smoke-test-results
          path: '**/gui-smoke-results.trx'
          if-no-files-found: ignore

      - name: Upload GUI smoke artifacts
        uses: actions/upload-artifact@v4
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.run_gui_smoke == true }}
        with:
          name: gui-smoke-artifacts
          path: artifacts/gui-smoke/**
          if-no-files-found: ignore
