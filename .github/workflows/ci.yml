name: CI

on:
  push:
    branches: [main]
    tags:
      - v0.2.0
      - v0.2.0-rc.*
      - v0.3.0
      - v0.3.0-rc.*
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_gui_smoke:
        description: Run optional Windows GUI smoke tests
        required: false
        default: false
        type: boolean

jobs:
  smoke:
    runs-on: windows-latest
    env:
      NLINK_BRIDGE_RUNTIME_DIR: artifacts/bridge/win-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Resolve VERSION
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "VERSION file is empty."
          }
          "NLINK_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Resolved nLink version from VERSION: $version"

      - name: Build (Release)
        shell: powershell
        run: |
          Write-Host "Building nLink version: $env:NLINK_VERSION"
          dotnet build nLink.sln -c Release --no-restore /p:NLinkVersion=$env:NLINK_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Format check (non-blocking)
        id: format_verify
        continue-on-error: true
        run: dotnet format nLink.sln --verify-no-changes --no-restore

      - name: Format check guidance
        if: ${{ always() && steps.format_verify.outcome == 'failure' }}
        run: |
          echo "dotnet format --verify-no-changes found formatting drift."
          echo "Run: dotnet format nLink.sln"
          echo "This is non-blocking for now."

      - name: Build bridge bundle
        shell: powershell
        run: .\installer\Build-BridgeBundle.ps1 -Runtime win-x64

      - name: Verify bridge bundle layout
        shell: powershell
        run: |
          Write-Host "NLINK_BRIDGE_RUNTIME_DIR=$env:NLINK_BRIDGE_RUNTIME_DIR"
          if (-not (Test-Path $env:NLINK_BRIDGE_RUNTIME_DIR)) {
            throw "Bridge runtime directory not found: $env:NLINK_BRIDGE_RUNTIME_DIR"
          }
          Get-ChildItem -Path $env:NLINK_BRIDGE_RUNTIME_DIR -Force
          Get-ChildItem -Path (Join-Path $env:NLINK_BRIDGE_RUNTIME_DIR "node_modules") -Force | Select-Object -First 20

      - name: Smoke tests
        run: dotnet test -c Release --filter Category=Smoke --no-build --logger "trx;LogFileName=smoke-results.trx"

      - name: Performance tests
        run: dotnet test -c Release --filter "Category=Performance&Category!=ManualSoak" --no-build --logger "trx;LogFileName=performance-results.trx"

      - name: Reliability gate (DevLocal benchmark, fast)
        run: dotnet run -c Release --no-build --project src/nLink.App -- --bench --cycles 20 --delay-ms 0 --transport devlocal --bridge-reuse-mode persession --reliability-gate

      - name: Install Inno Setup 6
        shell: powershell
        run: |
          choco install innosetup -y
          $innoSetupPath = "${env:ProgramFiles(x86)}\Inno Setup 6"
          if (Test-Path $innoSetupPath) {
            $env:Path = "$innoSetupPath;$env:Path"
          }
          Get-Command iscc.exe | Format-List *

      - name: Build installer + portable release assets
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path .\artifacts\installer | Out-Null
          $transcriptPath = (Resolve-Path .\artifacts\installer).Path | Join-Path -ChildPath "build-installer.log"
          Write-Host "Packaging nLink version: $env:NLINK_VERSION"
          Start-Transcript -Path $transcriptPath | Out-Null
          try {
            pwsh .\installer\Build-Installer.ps1 -Configuration Release -Runtime win-x64 -AppVersion $env:NLINK_VERSION
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Stop-Transcript | Out-Null
          }

      - name: Verify staged package manifests
        shell: powershell
        run: |
          .\build\verify-package-manifest.ps1 -StageDir .\artifacts\portable\nLink\win-x64 -ManifestPath .\installer\package-manifest.win-x64.txt
          .\build\verify-package-manifest.ps1 -StageDir .\artifacts\portable\helper\win-x64 -ManifestPath .\installer\package-manifest.win-x64.txt

      - name: Verify release assets
        shell: powershell
        run: .\build\verify-release-assets.ps1 -Version $env:NLINK_VERSION -Runtime win-x64

      - name: Upload smoke test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-results
          path: '**/smoke-results.trx'
          if-no-files-found: ignore

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-artifacts
          path: artifacts/bench/**
          if-no-files-found: ignore

      - name: Upload performance test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-test-results
          path: '**/performance-results.trx'
          if-no-files-found: ignore

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/tags/v0.2.0' || startsWith(github.ref, 'refs/tags/v0.2.0-rc.') || github.ref == 'refs/tags/v0.3.0' || startsWith(github.ref, 'refs/tags/v0.3.0-rc.') }}
        with:
          name: release-assets
          path: artifacts/releases/${{ env.NLINK_VERSION }}/**
          if-no-files-found: error

      - name: Upload packaging diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaging-diagnostics
          path: |
            artifacts/releases/**
            artifacts/installer/**
          if-no-files-found: ignore

      - name: GUI smoke tests (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_gui_smoke == true }}
        env:
          NLINK_RUN_GUI_SMOKE: '1'
        run: dotnet test -c Release --filter Category=GuiSmoke --no-build --logger "trx;LogFileName=gui-smoke-results.trx"

      - name: Upload GUI smoke test results
        uses: actions/upload-artifact@v4
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.run_gui_smoke == true }}
        with:
          name: gui-smoke-test-results
          path: '**/gui-smoke-results.trx'
          if-no-files-found: ignore

      - name: Upload GUI smoke artifacts
        uses: actions/upload-artifact@v4
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.run_gui_smoke == true }}
        with:
          name: gui-smoke-artifacts
          path: artifacts/gui-smoke/**
          if-no-files-found: ignore

  installer_smoke:
    runs-on: windows-latest
    needs: smoke

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve VERSION
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "VERSION file is empty."
          }
          "NLINK_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Resolved nLink version from VERSION: $version"

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: artifacts/release-assets

      - name: Silent installer smoke
        shell: powershell
        run: |
          $artifactDir = Join-Path $PWD "artifacts/release-assets"
          $installerExe = Join-Path $artifactDir "nLink-Setup-win-x64-$env:NLINK_VERSION.exe"
          if (-not (Test-Path $installerExe)) {
            $files = Get-ChildItem -Path $artifactDir -Recurse -File | Select-Object -ExpandProperty FullName
            throw "Installer executable not found: $installerExe`nDownloaded files:`n$($files -join "`n")"
          }

          $dir = Join-Path $env:TEMP "nlink-install-test"
          if (Test-Path $dir) {
            Remove-Item -Recurse -Force $dir
          }

          $installProcess = Start-Process -FilePath $installerExe -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$dir") -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) {
            throw "Silent install failed with exit code $($installProcess.ExitCode)."
          }

          $appExe = Join-Path $dir "nLink.exe"
          if (-not (Test-Path $appExe)) {
            throw "Installed app executable not found: $appExe"
          }

          $bridgeNode = Join-Path $dir "bridge/win-x64/node.exe"
          $bridgeScript = Join-Path $dir "bridge/win-x64/index.js"
          if (-not (Test-Path $bridgeNode)) {
            throw "Installed bundled bridge node executable not found: $bridgeNode"
          }

          if (-not (Test-Path $bridgeScript)) {
            throw "Installed bundled bridge script not found: $bridgeScript"
          }

          $selfTestProcess = Start-Process -FilePath $appExe -ArgumentList @('--self-test') -WorkingDirectory $dir -Wait -PassThru
          if ($selfTestProcess.ExitCode -ne 0) {
            throw "Installed app self-test failed with exit code $($selfTestProcess.ExitCode)."
          }

          $unins = Get-ChildItem -Path $dir -Filter "unins*.exe" -File | Select-Object -First 1
          if (-not $unins) {
            throw "Uninstaller not found in install directory: $dir"
          }

          $uninstallProcess = Start-Process -FilePath $unins.FullName -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($uninstallProcess.ExitCode -ne 0) {
            throw "Silent uninstall failed with exit code $($uninstallProcess.ExitCode)."
          }

          if (Test-Path $appExe) {
            throw "App executable still exists after uninstall: $appExe"
          }

          $remainingProcesses = @(Get-CimInstance Win32_Process | Where-Object {
            $_.ExecutablePath -and $_.ExecutablePath.StartsWith($dir, [System.StringComparison]::OrdinalIgnoreCase)
          })
          if ($remainingProcesses.Count -gt 0) {
            $details = @($remainingProcesses | ForEach-Object { "$($_.ExecutablePath) (pid=$($_.ProcessId))" }) -join "`n"
            throw "Processes still running from install directory after uninstall:`n$details"
          }

          if (Test-Path $dir) {
            $remaining = @(Get-ChildItem -Path $dir -Force -ErrorAction SilentlyContinue)
            Write-Host "Install directory remains after uninstall: $dir"
            Write-Host "Remaining entries: $($remaining.Count)"
          }

          Write-Host "Silent installer smoke passed for version $env:NLINK_VERSION"
